<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>夜市6x6賓果</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="title-wrap">
          <p class="mini-tag">夜市遊戲</p>
          <h1>6x6 賓果</h1>
        </div>
        <button id="reset-btn" class="secondary-btn" type="button">重置遊戲</button>
      </header>

      <section class="status-panel">
        <div class="status-item">
          <span class="label">抽牌次數</span>
          <strong id="draw-count">0 / 12</strong>
        </div>
        <div class="status-item large">
          <span class="label">已抽</span>
          <strong id="drawn-list">尚未抽牌</strong>
        </div>
      </section>

      <div id="message" class="message" aria-live="polite">開始抽牌，看看能不能連成一線！</div>

      <section class="board-wrap">
        <div id="board" class="board" aria-label="6x6 賓果棋盤"></div>
      </section>

      <div class="control-bar">
        <div class="controls-left">
          <label for="max-draws" class="label small">每回合抽牌上限</label>
          <select id="max-draws">
            <option value="12">12</option>
            <option value="15">15</option>
            <option value="18">18</option>
          </select>
        </div>
        <div class="controls-right">
          <button id="draw-btn" class="primary-btn" type="button">抽牌</button>
        </div>
      </div>

      <!-- 補抽覆蓋層 -->
      <div id="overlay" class="overlay hidden" aria-hidden="true">
        <div class="overlay-content">
          <button id="bonus-btn" class="bonus-action">海底撈月</button>
          <p class="overlay-desc">點擊「海底撈月」補抽最後一張（特別顏色）</p>
        </div>
      </div>
    </main>

    <script src="game.js"></script>
  </body>
</html>
